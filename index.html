<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Budget Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: linear-gradient(135deg, #f8f9fa 0%, #eef4ff 100%);
        min-height: 100vh;
      }

      .tracker-shell {
        max-width: 1100px;
        margin: 3rem auto;
        padding: 2rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 45px rgba(15, 30, 65, 0.12);
      }

      .page-title {
        font-weight: 700;
        letter-spacing: 0.03em;
      }

      .summary-card {
        background: linear-gradient(135deg, #e8f1ff, #f6faff);
        border: 1px solid #dfeafc;
        border-radius: 1rem;
      }

      .table thead th {
        background: #eaf2ff;
        color: #1f2d3d;
        border-bottom: 2px solid #d6e4ff;
      }

      .table td,
      .table th {
        vertical-align: middle;
      }

      .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #2563eb);
        border: none;
      }

      .btn-primary:hover {
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
      }

      @media (max-width: 576px) {
        .tracker-shell {
          margin: 1rem 0.75rem;
          padding: 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="tracker-shell">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <div>
          <p class="text-primary fw-semibold text-uppercase mb-2">Monthly overview</p>
          <h1 class="page-title display-6 mb-0">Budget Tracker</h1>
        </div>
        <div class="summary-card px-4 py-3 rounded-4">
          <small class="text-muted d-block">Total spent</small>
          <strong class="fs-4 text-dark">$<span id="expense-total">0.00</span></strong>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <section class="col-lg-5">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <h2 class="h4 mb-3">Add Expense</h2>
              <form id="expense-form" class="row g-3">
                <div class="col-12">
                  <label for="expense-name" class="form-label">Name</label>
                  <input id="expense-name" type="text" class="form-control" placeholder="e.g. Groceries" required />
                </div>
                <div class="col-md-6">
                  <label for="expense-amount" class="form-label">Amount</label>
                  <input id="expense-amount" type="number" class="form-control" placeholder="0.00" step="0.01" min="0" required />
                </div>
                <div class="col-md-6">
                  <label for="expense-category" class="form-label">Category</label>
                  <input id="expense-category" type="text" class="form-control" placeholder="e.g. Food" required />
                </div>
                <div class="col-12 d-grid">
                  <button id="add-expense" type="button" class="btn btn-primary btn-lg">Add Expense</button>
                </div>
              </form>
            </div>
          </div>
        </section>

        <section class="col-lg-7">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body p-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Expenses</h2>
                <span class="badge bg-light text-dark border">Monthly budget: $2200.00</span>
              </div>
              <div class="table-responsive">
                <table class="table align-middle table-hover mb-0">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Amount</th>
                      <th>Category</th>
                    </tr>
                  </thead>
                  <tbody id="expense-table-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
